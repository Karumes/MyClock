<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Karumes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="auroraCanvas" aria-hidden="true"></canvas>

  <main id="platform" class="platform-shell">
    <header class="topbar">
      <button id="brand-btn" class="brand-mark" type="button" aria-label="Karumes home">Karumes</button>
      <nav class="mode-tabs" aria-label="Karumes sections">
        <button class="tab active" type="button" data-section="library">Library</button>
        <button class="tab" type="button" data-section="create">Create</button>
      </nav>
      <div class="topbar-actions">
        <button id="dashboard-settings-btn" type="button" aria-label="Customize selected clock">Settings</button>
        <button id="launch-btn" type="button" aria-label="Launch selected clock">Launch</button>
      </div>
    </header>

    <section id="library-section" class="section active">
      <div class="hero-copy">
        <p>Clock selection platform</p>
      </div>
      <div id="clock-grid" class="clock-grid" aria-label="Clock previews"></div>
    </section>

    <section id="create-section" class="section create-section">
      <div class="create-workbench">
        <div class="code-pane">
          <div class="pane-bar">
            <span>create.clock</span>
            <button id="run-create" type="button" aria-label="Run create preview">Run</button>
          </div>
          <textarea id="create-code" spellcheck="false"></textarea>
        </div>
        <div class="create-preview-wrap">
          <div id="create-preview" class="create-preview"></div>
        </div>
      </div>
    </section>
  </main>

  <section id="saver" class="saver hidden" aria-label="Selected clock">
    <canvas id="clockCanvas"></canvas>
    <div class="saver-actions">
      <button id="home-btn" type="button" aria-label="Back to Karumes">&times;</button>
      <button id="settings-btn" type="button" aria-label="Customize clock">Settings</button>
    </div>
  </section>

  <aside id="settings-panel" class="settings-panel hidden" aria-label="Clock settings">
    <div class="settings-head">
      <span id="settings-title">Clock</span>
      <button id="close-settings" type="button" aria-label="Close settings">Close</button>
    </div>

    <div class="settings-grid">
      <label data-setting="bg">Background <input id="bg-custom-color" type="color" /></label>
      <label data-setting="primary">Main <input id="font-custom-color" type="color" /></label>
      <label data-setting="colon">Accent <input id="colon-custom-color" type="color" /></label>
      <label data-setting="card">Surface <input id="card-custom-color" type="color" /></label>
    </div>

    <div class="settings-row" data-setting="font">
      <span>Font</span>
      <select id="font-family-select">
        <option value="rounded">Rounded</option>
        <option value="modern">Modern</option>
        <option value="mono">Monospace</option>
        <option value="condensed">Condensed</option>
        <option value="serif">Serif</option>
      </select>
    </div>

    <div class="settings-row">
      <span>Size</span>
      <input id="clock-size-scale" type="range" min="0.65" max="1.45" step="0.01" />
    </div>

    <div class="settings-row" data-setting="fontSize">
      <span>Text size</span>
      <input id="flip-font-size-scale" type="range" min="0.7" max="1.35" step="0.01" />
    </div>

    <div class="settings-row" data-setting="image">
      <span>Image in digits</span>
      <input id="digit-image-input" type="file" accept="image/*" />
    </div>

    <div class="settings-row" data-setting="image">
      <span>Image scale</span>
      <input id="image-scale" type="range" min="0.5" max="2.5" step="0.05" />
    </div>

    <div class="settings-actions">
      <button id="clear-image" type="button">Clear Image</button>
      <button id="apply-btn" type="button">Launch</button>
    </div>
  </aside>

  <script src="clocks/clock-definitions.js"></script>
  <script src="clocks/clock1/binary.js"></script>
  <script src="clocks/clock2/rolling.js"></script>
  <script src="clocks/clock3/panel.js"></script>
  <script src="clocks/clock4/digital.js"></script>
  <script src="clocks/clock5/analog.js"></script>
  <script src="clocks/clock6/flip.js"></script>
  <script src="clocks/clock7/minimal-analog.js"></script>
  <script src="clocks/clock8/grid.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
