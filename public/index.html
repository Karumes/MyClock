<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Karumes</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="platform" class="platform-shell">
    <header class="topbar">
      <button id="brand-btn" class="brand-mark" type="button" aria-label="Karumes home">Karumes</button>
      <div class="topbar-actions">
        <button id="dashboard-settings-btn" type="button" aria-label="Customize selected clock">Settings</button>
        <button id="launch-btn" type="button" aria-label="Launch selected clock">Launch</button>
      </div>
    </header>

    <section id="library-section" class="section active">
      <div class="hero-copy">
        <p>Clock selection platform</p>
      </div>
      <div id="clock-grid" class="clock-grid" aria-label="Clock previews"></div>
    </section>
  </main>

  <section id="saver" class="saver hidden" aria-label="Selected clock">
    <canvas id="clockCanvas"></canvas>
    <div class="saver-actions">
      <button id="home-btn" type="button" aria-label="Back to Karumes">&times;</button>
      <button id="settings-btn" type="button" aria-label="Customize clock">Settings</button>
    </div>
  </section>

  <aside id="settings-panel" class="settings-panel hidden" aria-label="Clock settings">
    <div class="settings-head">
      <span id="settings-title">Clock</span>
      <button id="close-settings" type="button" aria-label="Close settings">Close</button>
    </div>

    <div class="settings-grid">
      <div class="settings-color" data-setting="bg" data-color-target="bg-custom-color">
        <span>Background</span>
        <div class="color-swatches" data-swatches="bg"></div>
        <div class="custom-color-panel"><input id="bg-custom-color" type="color" /></div>
      </div>
      <div class="settings-color" data-setting="primary" data-color-target="font-custom-color">
        <span>Main</span>
        <div class="color-swatches" data-swatches="primary"></div>
        <div class="custom-color-panel"><input id="font-custom-color" type="color" /></div>
      </div>
      <div class="settings-color" data-setting="colon" data-color-target="colon-custom-color">
        <span>Accent</span>
        <div class="color-swatches" data-swatches="colon"></div>
        <div class="custom-color-panel"><input id="colon-custom-color" type="color" /></div>
      </div>
      <div class="settings-color" data-setting="card" data-color-target="card-custom-color">
        <span>Surface</span>
        <div class="color-swatches" data-swatches="card"></div>
        <div class="custom-color-panel"><input id="card-custom-color" type="color" /></div>
      </div>
    </div>

    <div class="settings-row" data-setting="font">
      <span>Font</span>
      <select id="font-family-select">
        <option value="rounded">Font 1</option>
        <option value="modern">Font 2</option>
        <option value="mono">Font 3</option>
        <option value="condensed">Font 4</option>
        <option value="serif">Font 5</option>
      </select>
    </div>

    <div class="settings-row" data-setting="size">
      <span>Clock size</span>
      <input id="clock-size-scale" type="range" min="0.55" max="4.5" step="0.01" />
    </div>

    <div class="settings-row" data-setting="fontSize">
      <span>Text size</span>
      <input id="text-size-scale" type="range" min="0.65" max="3.5" step="0.01" />
    </div>

    <div class="settings-row" data-setting="panelSize">
      <span>Panel size</span>
      <input id="panel-size-scale" type="range" min="0.65" max="1.6" step="0.01" />
    </div>

    <div class="settings-actions">
      <button id="apply-btn" type="button">Launch</button>
    </div>
  </aside>

  <script src="clocks/clock-definitions.js"></script>
  <script src="clocks/clock1/binary.js"></script>
  <script src="clocks/clock2/rolling.js"></script>
  <script src="clocks/clock3/panel.js"></script>
  <script src="clocks/clock4/digital.js"></script>
  <script src="clocks/clock5/analog.js"></script>
  <script src="clocks/clock6/flip.js"></script>
  <script src="clocks/clock7/minimal-analog.js"></script>
  <script src="clocks/clock8/grid.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
