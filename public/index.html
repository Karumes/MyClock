<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyClock</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="ui-bar">
    <button id="settings-btn" type="button" title="Settings" aria-label="Open settings">&#9881;</button>
    <div id="settings-panel" class="hidden">
      <div class="settings-group">
        <label for="clock-style-label">Clock Style:</label>
        <button id="clock-style-prev" type="button" aria-label="Previous clock style">&#9664;</button>
        <span id="clock-style-label">Clock 1</span>
        <button id="clock-style-next" type="button" aria-label="Next clock style">&#9654;</button>
      </div>

      <div id="font-color-group" class="settings-group">
        <label id="font-color-label">Font Color:</label>
        <div id="color-options"></div>
        <div id="font-special-swatches">
          <div class="font-special-row">
            <button id="font-half-swatch" type="button" title="Edit gradient font color" aria-label="Edit gradient font color"></button>
            <input type="color" id="font-custom-color" aria-label="Custom font color" />
          </div>
          <div id="font-gradient-controls" class="gradient-controls hidden">
            <input type="color" id="font-grad-c1" aria-label="Gradient color 1" />
            <input type="color" id="font-grad-c2" aria-label="Gradient color 2" />
            <select id="font-grad-pattern" aria-label="Gradient direction">
              <option value="vertical">Vertical</option>
              <option value="horizontal">Horizontal</option>
              <option value="diag-tlbr">Diagonal TL-BR</option>
              <option value="diag-bltr">Diagonal BL-TR</option>
              <option value="radial">Radial</option>
            </select>
          </div>
        </div>
      </div>

      <div id="clock1-back-group" class="settings-group hidden">
        <label>Reverse Side Color:</label>
        <div id="clock1-back-color-options"></div>
        <div class="background-picker-row">
          <input type="color" id="clock1-back-custom-color" aria-label="Custom reverse side color" />
        </div>
      </div>

      <div id="background-group" class="settings-group">
        <label>Background Color:</label>
        <div id="bg-color-options"></div>
        <div id="bg-special-swatches">
          <div class="font-special-row">
            <button id="bg-half-swatch" type="button" title="Edit gradient background" aria-label="Edit gradient background"></button>
            <input type="color" id="bg-custom-color" aria-label="Custom background color" />
          </div>
          <div id="bg-gradient-controls" class="gradient-controls hidden">
            <input type="color" id="bg-grad-c1" aria-label="Background gradient color 1" />
            <input type="color" id="bg-grad-c2" aria-label="Background gradient color 2" />
            <select id="bg-grad-pattern" aria-label="Background gradient direction">
              <option value="vertical">Vertical</option>
              <option value="horizontal">Horizontal</option>
              <option value="diag-tlbr">Diagonal TL-BR</option>
              <option value="diag-bltr">Diagonal BL-TR</option>
              <option value="radial">Radial</option>
            </select>
          </div>
        </div>
      </div>

      <div id="font-family-group" class="settings-group">
        <label for="font-family-select">Font:</label>
        <select id="font-family-select">
          <option value="rounded">Rounded</option>
          <option value="modern">Modern</option>
          <option value="mono">Monospace</option>
          <option value="condensed">Condensed</option>
          <option value="serif">Serif</option>
        </select>
      </div>

      <button id="apply-btn" type="button">Confirm Change</button>
    </div>
  </div>

  <canvas id="clockCanvas"></canvas>
  <script src="renderer.js"></script>
</body>
</html>
